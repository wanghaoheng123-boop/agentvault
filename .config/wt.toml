# Worktrunk lifecycle configuration
#
# Requires Worktrunk (`wt`). If it is not installed, the raw `git worktree`
# equivalents in AGENTS.md section 6 do the same work manually. Adapt the test
# and lint commands below to your project before relying on pre-merge.
#
# Hook environment: the hooks below read WT_BRANCH / WT_WORKTREE_PATH /
# WT_MAIN_REPO when Worktrunk provides them and fall back to `git` otherwise,
# so they also run correctly when invoked by hand.
#
# Design rule (ADR-0001): code is isolated per worktree; cognition is shared.
# `.agentvault/` is symlinked, never copied — a copy would fork the board.

[core]
repo_name = "project"
default_branch = "main"

[templates]
# Predictable, collision-free sibling paths: ../<repo>.<branch-with-dashes>
# e.g. branch "feat/payment" -> ../workspace.feat-payment
worktree_path = "../{{ repo_name }}.{{ branch | replace('/', '-') }}"

[env]
# Deterministic per-branch port. NOTE: speculative scaffolding — this repo is
# pure Python with no service that binds a port and no pre-existing .env*
# convention. Nothing reads PORT today (see lessons-learned L10).
port_range = "3100..3899"

# --------------------------------------------------------------------------
# post-create: run once, immediately after the new worktree is checked out.
# --------------------------------------------------------------------------
[hooks]
post-create = '''
set -euo pipefail

BRANCH="${WT_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
WORKTREE="${WT_WORKTREE_PATH:-$PWD}"
# NOTE: sed, not awk — this repo's path contains spaces, which awk would split on.
MAIN_REPO="${WT_MAIN_REPO:-$(git worktree list --porcelain | sed -n '1s/^worktree //p')}"
# Handoff filenames flatten slashes the same way worktree_path does,
# so branch "feat/payment" -> handoffs/feat-payment.md (not a nested dir).
BRANCH_SLUG="$(printf '%s' "$BRANCH" | tr '/' '-')"
TASK_ID="${WT_TASK_ID:-$BRANCH}"
AGENT="${AVCOORD_AGENT:-${WT_AGENT:-unassigned-agent}}"

cd "$WORKTREE"

# 1. Share cognition: symlink the canonical .agentvault into this worktree.
#    Symlink (not copy) so board.json and handoffs/ are one live copy across
#    every agent. A copy would silently fork the ledger. See ADR-0001.
if [ -e ".agentvault" ] && [ ! -L ".agentvault" ]; then
  echo "post-create: refusing to replace a real .agentvault directory in $WORKTREE" >&2
  exit 1
fi
ln -sfn "$MAIN_REPO/.agentvault" ".agentvault"
echo "post-create: linked .agentvault -> $MAIN_REPO/.agentvault"

# Guard the one nesting the health check rejects.
if [ -e "$MAIN_REPO/.agentvault/MemoryBank" ]; then
  echo "post-create: FATAL .agentvault/MemoryBank exists — DUAL_SSOT, see INDEX.md" >&2
  exit 1
fi

# 2. Deterministic per-branch port into .env.local (gitignored via .env.*).
PORT="$(wt config eval "{{ hash_port 3100..3899 }}" 2>/dev/null || true)"
if [ -z "$PORT" ]; then
  # Fallback so the hook is useful without `wt`: stable hash of the branch name.
  PORT=$(python3 -c "import sys,zlib;print(3100+zlib.crc32(sys.argv[1].encode())%800)" "$BRANCH")
fi
if [ -f ".env.local" ] && grep -q '^PORT=' ".env.local"; then
  # Idempotent (invariant C9): re-running must not append a second PORT.
  python3 - "$PORT" <<'PY'
import re, sys, pathlib
p = pathlib.Path(".env.local")
p.write_text(re.sub(r"(?m)^PORT=.*$", f"PORT={sys.argv[1]}", p.read_text()))
PY
else
  printf 'PORT=%s\n' "$PORT" >> ".env.local"
fi
echo "post-create: PORT=$PORT -> .env.local"

# 3. Register this branch on the shared board as actively worked.
python3 ".agentvault/bin/av-board.py" claim \
  --id "$TASK_ID" \
  --branch "$BRANCH" \
  --agent "$AGENT" \
  --title "Work on $BRANCH" >/dev/null
echo "post-create: board -> $TASK_ID IN_PROGRESS ($AGENT)"

# 4. Orient the incoming agent.
if [ -f ".agentvault/handoffs/$BRANCH_SLUG.md" ]; then
  echo "post-create: NOTE an existing handoff was found — read it before editing:"
  echo "             .agentvault/handoffs/$BRANCH_SLUG.md"
fi
'''

# --------------------------------------------------------------------------
# pre-merge: gate before the branch folds into the default branch.
# --------------------------------------------------------------------------
pre-merge = '''
set -euo pipefail

BRANCH="${WT_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
TASK_ID="${WT_TASK_ID:-$BRANCH}"
AUDIT_LOG=".merge_audit.log"
BRANCH_SLUG="$(printf '%s' "$BRANCH" | tr '/' '-')"
HANDOFF=".agentvault/handoffs/$BRANCH_SLUG.md"

{
  echo "=== pre-merge $BRANCH $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
} >> "$AUDIT_LOG"

# 1. Deterministic test suite. Explicit paths on purpose: a bare pytest from
#    the repo root collects templates/agentvault-portable/ and dies with 11
#    collection errors (lessons-learned L1).
echo "pre-merge: running test suites"
# Replace with YOUR project's test command; record it in .agentvault/INDEX.md
# so hooks and agents run the same thing. Pass explicit suite paths: a bare
# run from the repo root may collect this template's nested copies.
python3 -m pytest scripts/coord/tests -q --tb=line 2>&1 | tee -a "$AUDIT_LOG"

# 2. Static analysis. Add your linters and type-checkers here; compileall is
#    the baseline that needs no extra tooling.
echo "pre-merge: compileall"
python3 -m compileall -q scripts 2>&1 | tee -a "$AUDIT_LOG"

# 3. Adversarial invariant audit by an independent agent.
echo "pre-merge: adversarial invariant audit"
DIFF="$(git diff "${WT_DEFAULT_BRANCH:-main}"...HEAD)"
VERDICT="$(printf '%s\n' "$DIFF" | claude --print "You are an adversarial auditor. \
Below is a git diff. Judge it ONLY against the invariants in \
.agentvault/invariants/security.md and .agentvault/invariants/concurrency-and-data.md. \
Look specifically for: secrets or run tokens committed; non-atomic writes to shared \
state; rewritten journal lines; lease enforcement bypassed (--no-verify, edited \
.githooks); a new .agentvault/MemoryBank path; a hand-edited projection instead of a \
journal correction. \
Reply with exactly one line: 'APPROVED' or 'REJECTED: <specific invariant id and reason>'. \
Diff follows:")"
printf 'audit verdict: %s\n' "$VERDICT" >> "$AUDIT_LOG"
echo "pre-merge: $VERDICT"

case "$VERDICT" in
  APPROVED*) ;;
  *)
    echo "pre-merge: BLOCKED by invariant audit — see $AUDIT_LOG" >&2
    python3 ".agentvault/bin/av-board.py" set --id "$TASK_ID" --status BLOCKED \
      --notes "pre-merge audit: $VERDICT" >/dev/null
    exit 1
    ;;
esac

# 4. Approved: harvest lessons, close the task, archive the handoff.
python3 - "$BRANCH" <<'PY' >> .agentvault/memory/lessons-learned.md
import subprocess, sys, datetime
branch = sys.argv[1]
subjects = subprocess.run(
    ["git", "log", "--no-merges", "--pretty=- %s", "main..HEAD"],
    capture_output=True, text=True,
).stdout.strip() or "- (no non-merge commits)"
stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
print(f"\n### Merged `{branch}` ({stamp})\n\n{subjects}\n")
PY
echo "pre-merge: takeaways appended to .agentvault/memory/lessons-learned.md"

python3 ".agentvault/bin/av-board.py" merged --id "$TASK_ID" >/dev/null
echo "pre-merge: board -> $TASK_ID MERGED"

if [ -f "$HANDOFF" ]; then
  mkdir -p ".agentvault/handoffs/archive"
  git mv "$HANDOFF" ".agentvault/handoffs/archive/$BRANCH_SLUG.$(date -u +%Y%m%d).md" 2>/dev/null \
    || mv "$HANDOFF" ".agentvault/handoffs/archive/$BRANCH_SLUG.$(date -u +%Y%m%d).md"
  echo "pre-merge: archived $HANDOFF"
fi
'''
